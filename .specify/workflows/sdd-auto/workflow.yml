schema_version: "1.0"
workflow:
  id: "sdd-auto"
  name: "SDD Auto (no gate, no git)"
  version: "1.0.0"
  author: "you"
  description: |
    spec-kit 标准 4 步全自动流程：specify → plan → tasks → implement。
    无 gate，无 git 依赖。从默认或指定的 feature 目录读取 spec。
    适用场景：
      - 从零开始一个新 feature（先 mkdir specs/002-xxx/ 并写 spec.md，再跑）
      - 续做中断的 feature（已有 spec/plan/tasks，跑一次等于推进到最新）
      - 触发一次端到端重跑（inputs.force_refresh=true 时所有 spec/plan/tasks 被强制重写）

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any: ["claude", "codex"]

inputs:
  feature_dir:
    type: string
    required: false
    default: "__auto__"
    prompt: "Feature 目录名（如 001-page-separators）。留空则取 specs/ 下最新的 NNN-* 目录"
  integration:
    type: string
    required: false
    default: "auto"
    prompt: "Integration 名称（如 claude）。留空走项目默认"
  force_refresh:
    type: boolean
    required: false
    default: false
    prompt: "是否强制刷新 spec/plan/tasks（true=全部重写；false=已就绪则跳过）"

steps:
  # ========================================================
  # 0. 预检：找仓库根、决定 feature、写 .specify/feature.json
  # ========================================================
  - id: preflight
    type: shell
    run: |
      set -euo pipefail

      # 1. 找仓库根（不依赖 git，纯靠 .specify 标记向上找）
      REPO_ROOT="${SPECIFY_INIT_DIR:-}"
      if [ -z "$REPO_ROOT" ] || [ ! -d "$REPO_ROOT/.specify" ]; then
        REPO_ROOT="$PWD"
        while [ "$REPO_ROOT" != "/" ] && [ ! -d "$REPO_ROOT/.specify" ]; do
          REPO_ROOT="$(dirname "$REPO_ROOT")"
        done
      fi

      if [ ! -d "$REPO_ROOT/.specify" ]; then
        echo "ERROR: 找不到 .specify/ 目录（不在 spec-kit 项目中）" >&2
        exit 1
      fi

      # 切到仓库根，让后续所有相对路径正确（iCloud 路径含空格，必须引号）
      cd "$REPO_ROOT"
      export REPO_ROOT

      # 2. 决定 feature_dir
      FEATURE_INPUT="{{ inputs.feature_dir }}"
      if [ -z "$FEATURE_INPUT" ] || [ "$FEATURE_INPUT" = "__auto__" ]; then
        # 按字典序倒序取最新（001/002 这种前缀字典序 = 数字序）
        FEATURE_DIR="$(ls -1 "$REPO_ROOT/specs/" 2>/dev/null | grep -E '^[0-9]+-' | sort -r | head -1 || true)"
      else
        FEATURE_DIR="$FEATURE_INPUT"
      fi
      FEATURE_DIR="${FEATURE_DIR%/}"

      if [ -z "$FEATURE_DIR" ]; then
        echo "ERROR: specs/ 下没找到 NNN-* 格式的 feature 目录" >&2
        echo "  specs/ 当前内容:" >&2
        ls -1 "$REPO_ROOT/specs/" >&2 || true
        exit 1
      fi

      # 3. 校验 spec.md
      SPEC_FILE="$REPO_ROOT/specs/$FEATURE_DIR/spec.md"
      if [ ! -f "$SPEC_FILE" ]; then
        echo "ERROR: spec 文件不存在: $SPEC_FILE" >&2
        echo "  specs/$FEATURE_DIR/ 当前内容:" >&2
        ls -1 "$REPO_ROOT/specs/$FEATURE_DIR/" >&2 || true
        exit 1
      fi

      # 4. 写 .specify/feature.json（覆盖，让下游命令识别当前 feature）
      FEATURE_RELATIVE="specs/$FEATURE_DIR"
      CURRENT_FD=""
      if [ -f "$REPO_ROOT/.specify/feature.json" ]; then
        CURRENT_FD="$(grep -oE '"feature_directory"[[:space:]]*:[[:space:]]*"[^"]*"' "$REPO_ROOT/.specify/feature.json" 2>/dev/null | head -1 | sed -E 's/.*"([^"]+)"$/\1/' || true)"
      fi
      if [ -n "$CURRENT_FD" ] && [ "$CURRENT_FD" != "$FEATURE_RELATIVE" ]; then
        echo "WARN: .specify/feature.json 从 '$CURRENT_FD' 切到 '$FEATURE_RELATIVE'" >&2
      fi
      printf '{"feature_directory":"%s"}\n' "$FEATURE_RELATIVE" > "$REPO_ROOT/.specify/feature.json"

      # 5. 记开始时间（给 summary step 用）
      date +%s > "$REPO_ROOT/.specify/.sdd-auto-start"

      # 6. 报告
      echo "================================================"
      echo "SDD Auto preflight OK"
      echo "  REPO_ROOT     = $REPO_ROOT"
      echo "  FEATURE_DIR   = $FEATURE_RELATIVE"
      echo "  SPEC          = $SPEC_FILE ($(wc -l < "$SPEC_FILE" | tr -d ' ') 行)"
      echo "  INTEGRATION   = {{ inputs.integration }}"
      echo "  FORCE_REFRESH = {{ inputs.force_refresh }}"
      echo "================================================"

  # ========================================================
  # 1. 规格：基于现有 spec.md 判断 + 补全
  # ========================================================
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: |
        用 Read 工具读取 .specify/feature.json 找到当前 feature 目录（形如 specs/NNN-xxx），
        然后读取该目录下的 spec.md。

        判断标准：
        - 如果 spec.md 已完整覆盖功能描述、用户故事、验收标准、边界场景，视为完成，
          不要重写。用一段简短的中文回复"spec 已就绪"，并说明判断依据。
        - 如果存在缺失章节，按现有 spec 风格补全。
        - 如果有歧义，使用 AskUserQuestion 工具询问用户。

        当前 inputs.force_refresh 的值是 {{ inputs.force_refresh }}。
        如果该值为 true，忽略上述判断，无条件重写整个 spec.md（保留风格一致）；
        如果为 false，按上述判断标准处理。

  # ========================================================
  # 2. 计划：基于现有 spec + plan.md
  # ========================================================
  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: |
        用 Read 工具读取 .specify/feature.json 找到当前 feature 目录，
        然后读取该目录下的 spec.md 和 plan.md（如果存在）。

        判断标准：
        - 如果 plan.md 已存在、且覆盖了 spec 中所有关键技术决策
          （数据模型 / 接口契约 / 关键算法 / 风险），视为完成，不要重写。
          用简短中文回复"plan 已就绪"即可。
        - 如果 plan.md 缺失或不完整，按现有 spec 补全。

        当前 inputs.force_refresh 的值是 {{ inputs.force_refresh }}。
        如果为 true，强制重写 plan.md；否则按上述判断处理。

  # ========================================================
  # 3. 任务：基于现有 spec/plan + tasks.md
  # ========================================================
  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: |
        用 Read 工具读取 .specify/feature.json 找到当前 feature 目录，
        然后读取该目录下的 spec.md、plan.md、tasks.md。

        判断标准：
        - 如果 tasks.md 已存在、且 task 列表能完整覆盖 plan.md 中所有实施项，
          视为完成，不要重写。用简短中文回复"tasks 已就绪"即可。
        - 如果 tasks.md 缺失或不完整，按现有 spec/plan 补全 tasks.md。

        当前 inputs.force_refresh 的值是 {{ inputs.force_refresh }}。
        如果为 true，强制重写 tasks.md；否则按上述判断处理。

  # ========================================================
  # 4. 实施：按 tasks.md 改代码
  # ========================================================
  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: |
        用 Read 工具读取 .specify/feature.json 找到当前 feature 目录，
        然后读取该目录下的 tasks.md。

        按 tasks.md 中的任务清单（按 [ ] → [x] 顺序）逐项执行：
        - 改代码
        - 在 tasks.md 中把对应任务标记为 [x]
        - 每完成 1-2 个任务后，简要说明做了什么

        遇到真正歧义的任务（无法从 spec/plan/tasks 推断出该怎么做）才停下来问。
        不要每步都问。

  # ========================================================
  # 5. 收尾：汇总改动（不依赖 git）
  # ========================================================
  - id: summary
    type: shell
    run: |
      set -uo pipefail  # 不开 -e，统计失败不致命

      # 1. 再算一次 REPO_ROOT（不同 step 不共享 shell 状态）
      REPO_ROOT="${SPECIFY_INIT_DIR:-}"
      if [ -z "$REPO_ROOT" ] || [ ! -d "$REPO_ROOT/.specify" ]; then
        REPO_ROOT="$PWD"
        while [ "$REPO_ROOT" != "/" ] && [ ! -d "$REPO_ROOT/.specify" ]; do
          REPO_ROOT="$(dirname "$REPO_ROOT")"
        done
      fi
      cd "$REPO_ROOT"

      # 2. 算耗时
      START_FILE="$REPO_ROOT/.specify/.sdd-auto-start"
      if [ -f "$START_FILE" ]; then
        START_TS="$(cat "$START_FILE")"
      else
        START_TS="$(($(date +%s) - 60))"  # fallback：1 分钟前
      fi
      NOW_TS="$(date +%s)"
      DURATION=$((NOW_TS - START_TS))
      DURATION_MIN=$((DURATION / 60))
      DURATION_SEC=$((DURATION % 60))

      # 3. 读 feature 目录
      FEATURE_FD="$(grep -oE '"feature_directory"[[:space:]]*:[[:space:]]*"[^"]*"' "$REPO_ROOT/.specify/feature.json" 2>/dev/null | head -1 | sed -E 's/.*"([^"]+)"$/\1/')"
      FEATURE_DIR="${FEATURE_FD#specs/}"

      # 4. 输出
      echo ""
      echo "================================================"
      echo "SDD Auto 完成"
      echo "  Feature  = $FEATURE_FD"
      echo "  耗时     = ${DURATION_MIN}m ${DURATION_SEC}s"
      echo "================================================"
      echo ""
      echo "[specs/ 下本次运行中被修改的文档]"
      SPECS_CHANGED="$(find "$REPO_ROOT/specs/$FEATURE_DIR" -name '*.md' -newer "$START_FILE" 2>/dev/null || true)"
      if [ -n "$SPECS_CHANGED" ]; then
        echo "$SPECS_CHANGED" | sed 's/^/  /'
      else
        echo "  (无)"
      fi
      echo ""
      echo "[src/ scripts/ 下本次运行中被修改的代码文件]"
      if [ -d "$REPO_ROOT/src" ] || [ -d "$REPO_ROOT/scripts" ]; then
        CODE_CHANGED="$(find "$REPO_ROOT/src" "$REPO_ROOT/scripts" -type f -newer "$START_FILE" 2>/dev/null || true)"
        if [ -n "$CODE_CHANGED" ]; then
          echo "$CODE_CHANGED" | sed 's|^|  |' | head -30
          TOTAL="$(echo "$CODE_CHANGED" | wc -l | tr -d ' ')"
          if [ "$TOTAL" -gt 30 ]; then
            echo "  ... 共 $TOTAL 个文件（仅显示前 30）"
          fi
        else
          echo "  (无)"
        fi
      else
        echo "  (项目无 src/ 或 scripts/ 目录)"
      fi
      echo ""
      echo "[下一步建议]"
      echo "  - 检查 src/ 改动是否符合预期"
      echo "  - 跑 npm run dev 看实际效果"
      echo "  - 满意后跑 npm run build 生成 resume.html"
      echo "  - 想做更细 review：跑 /speckit-checklist 生成验收清单"
      echo "  - 查 spec/plan/tasks 一致性：跑 /speckit-analyze"

      # 5. 清理
      rm -f "$START_FILE" || true
